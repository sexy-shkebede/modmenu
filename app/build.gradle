plugins {
    id 'com.android.application'
}

android {
    namespace 'com.openxr.hooktest'
    compileSdk 35

    // Quest builds are ARM64. Keeping this explicit also prevents accidental
    // host/x86 variants from being produced for the headset.
    ndkVersion '27.2.12479018'

    defaultConfig {
        applicationId 'com.openxr.hooktest'
        minSdk 29
        targetSdk 35

        ndk {
            abiFilters 'arm64-v8a'
        }

        externalNativeBuild {
            cmake {
                cppFlags '-std=c++17'
                // один самодостаточный .so: libc++ внутри, без зависимости от libc++_shared.so
                arguments '-DANDROID_STL=c++_static'
            }
        }
    }

    externalNativeBuild {
        cmake {
            path file('src/main/cpp/CMakeLists.txt')
            version '3.22.1'
        }
    }

    buildTypes {
        debug {
            minifyEnabled false
        }
        release {
            minifyEnabled false
        }
    }

    packaging {
        jniLibs {
            useLegacyPackaging = false
        }
    }
}
